services:
  web:
    image: node:24-slim
    container_name: rebrand-dev
    working_dir: /app

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - rebrand_node_modules:/app/node_modules
      - rebrand_next:/app/.next

    env_file:
      - .env.local

    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"

    command: >
      sh -c "npm run dev -- --webpack --hostname 0.0.0.0"

volumes:
  rebrand_node_modules:
  rebrand_next: