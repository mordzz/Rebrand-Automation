# Deploy: fly deploy
# One image (see Dockerfile), shared by multiple process groups — only
# `app` serves HTTP traffic. `paper` runs the per-user trading worker.
#
# The `paper` worker trades every deployed bot on Robinhood Chain in paper
# mode (live Robinhood execution is not wired into the daemon; mainnet is
# disabled). It needs AGENT_WALLET_ENCRYPTION_KEY and
# LIGHTER_API_KEY_ENCRYPTION_KEY to read the bots' encrypted credentials.
# There is no house trading daemon and no house wallet key: the retired
# Solana `sniper` process and its PRIVATE_KEY_SOLANA_WALLET are gone.
app = "noah-engine"
primary_region = "iad"

[build]
  # Public by design (inlined into the client bundle) — not a secret, safe
  # to commit. Matches components/providers.tsx's PRIVY_APP_ID.
  [build.args]
    NEXT_PUBLIC_PRIVY_APP_ID = "cmroz267200ju0cjqohmdfj5j"

[env]
NODE_ENV = "production"
PORT = "3000"

[processes]
app = "npm run start"
paper = "npm run paper"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[vm]]
processes = ["app"]
size = "shared-cpu-1x"
memory = "512mb"

[[vm]]
processes = ["paper"]
size = "shared-cpu-1x"
memory = "256mb"
